<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>Tandem Lift 2D Online</title>
<style>
:root{
  --ink:#1b2036; --card:rgba(250,246,240,.97); --muted:#5b6078; --line:rgba(27,32,54,.2);
  --p1:#0f9a8a; --p2:#d63a51; --btn:#1b2036; --btnink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#eef0fa; --card:rgba(17,21,43,.96); --muted:#a7adc9; --line:rgba(238,240,250,.22);
    --p1:#46e0cc; --p2:#ff7f90; --btn:#eef0fa; --btnink:#11152b; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#11152b;color:#f3f5ff;
  font-family:'Avenir Next Condensed','Bahnschrift','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;font-variant-numeric:tabular-nums}
input{user-select:text;-webkit-user-select:text}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(12,16,36,.58);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);border-radius:12px}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#objective{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;display:flex;gap:10px;align-items:center;
  padding:8px 14px 8px 10px;max-width:min(310px,54vw)}
#arrow{width:34px;height:34px;flex:none;transition:transform .08s linear}
#arrow svg{width:100%;height:100%;display:block}
#obT{font-size:17px;font-weight:700;line-height:1.15}
#obS{font-size:13px;opacity:.85;margin-top:2px}
#net{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 70px);left:10px;padding:4px 10px;font-size:13px;display:none}
#net i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#46e0cc}
#vitals{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;gap:12px;align-items:center;padding:8px 14px;font-size:14px;white-space:nowrap}
#hp{width:90px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#hpfill{height:100%;width:100%;background:#a6e35a;transition:width .2s,background .2s}
#props{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 46px);left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:6px 12px;font-size:14px;white-space:nowrap}
#pgrid{display:grid;grid-template-columns:repeat(2,74px);gap:5px 8px}
.pb{position:relative;height:9px;border-radius:5px;background:rgba(255,255,255,.18)}
.pb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;width:30%}
.pb.t i{background:#46e0cc}
.pb.c i{background:#ff7f90}
#fanst{min-width:90px;text-align:left}
#net{pointer-events:auto}
#net button,#voice button{font:inherit;font-size:12px;padding:2px 9px;margin-left:8px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
#voice{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 106px);left:10px;display:none;gap:6px;align-items:center;padding:5px 8px;font-size:13px;pointer-events:auto}
#voice.on{display:flex}
#voice button{margin-left:0;font-size:13px;padding:4px 10px}
#voice button.live{background:#46e0cc;color:#04231f;border-color:#46e0cc}
#wait{position:absolute;left:50%;top:36%;transform:translateX(-50%);padding:12px 18px;font-size:18px;font-weight:700;text-align:center;display:none;max-width:80vw}
#wait.on{display:block}
.panel.p1.speaking{box-shadow:0 0 0 3px #46e0cc,0 0 24px #46e0cc}
.panel.p2.speaking{box-shadow:0 0 0 3px #ff7f90,0 0 24px #ff7f90}
.srv{margin:10px 0 0;color:var(--muted);font-size:14px}
.srv input{font:inherit;font-size:14px;width:min(340px,100%);padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}
#fsBtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:198px;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.3);
  background:rgba(12,16,36,.58);color:#fff;font-size:18px;padding:0;pointer-events:auto;cursor:pointer}
#rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#11152b;color:#fff;text-align:center;padding:24px;font-size:20px;font-weight:700}
#rotate .ricon{font-size:64px;animation:rot 1.8s ease-in-out infinite}
#rotate small{font-size:14px;font-weight:400;opacity:.8;max-width:32ch;line-height:1.4}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#rotate .ricon{animation:none}}
#map{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;width:180px;height:72px;border-radius:12px;border:1px solid rgba(255,255,255,.2)}
#readout{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 80px);right:10px;width:180px;padding:6px 10px;font-size:13px;line-height:1.5}
#readout div{display:flex;justify-content:space-between}
#readout b{font-weight:600}
#loadwrap{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);width:min(320px,80vw);padding:12px 14px;text-align:center;display:none}
#loadwrap.on{display:block}
#loadbar{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;margin:8px 0}
#loadfill{height:100%;width:0;background:#ffc857}
#loadtxt{font-size:15px;font-weight:600}
.pills{display:flex;gap:8px;justify-content:center;margin-top:6px}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.3);opacity:.7}
#pl1.on{background:#46e0cc;color:#04231f;border-color:#46e0cc;opacity:1}
#pl2.on{background:#ff7f90;color:#2b0910;border-color:#ff7f90;opacity:1}
#toast{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 92px);transform:translate(-50%,-8px);
  padding:8px 16px;font-size:16px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;text-align:center;max-width:70vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#say{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);background:#fff;color:#14172a;padding:8px 16px;border-radius:18px;
  font:700 18px 'Comic Sans MS','Chalkboard SE','Comic Neue',cursive,sans-serif;opacity:0;transition:opacity .2s;max-width:70vw;text-align:center}
#say::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
#say.show{opacity:1}
#reactbar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:5px 8px;pointer-events:auto}
#reactbar button{font-size:22px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);padding:0;cursor:pointer;touch-action:manipulation}
#reactbar button:active{background:rgba(255,255,255,.35)}
#reacts{position:absolute;inset:0;overflow:hidden}
.react{position:absolute;bottom:14%;font-size:44px;animation:rise 2.3s ease-out forwards}
.react.p1{text-shadow:0 0 14px #46e0cc,0 0 4px #46e0cc}
.react.p2{text-shadow:0 0 14px #ff7f90,0 0 4px #ff7f90}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-300px) scale(1);opacity:0}}
.panel{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));padding:10px 12px;font-size:14px;line-height:1.5;max-width:44vw;text-align:center}
.panel h3{margin:0 0 2px;font-size:16px}
.panel.p1{left:10px;border-left:4px solid #46e0cc}
.panel.p1 h3{color:#46e0cc}
.panel.p2{right:10px;border-right:4px solid #ff7f90}
.panel.p2 h3{color:#ff7f90}
body.online-p1 .panel.p2,body.online-p2 .panel.p1{display:none}
kbd{display:inline-block;min-width:22px;padding:0 6px;margin-right:3px;border-radius:5px;border:1px solid rgba(255,255,255,.35);
  border-bottom-width:2px;background:rgba(255,255,255,.1);font:inherit;font-size:13px;text-align:center}
.sliders{display:flex;gap:16px;justify-content:center;margin:6px 0}
.sl-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.slider{--v:.3;--a:.3;position:relative;width:52px;height:clamp(100px,30vh,190px);border-radius:26px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.25);touch-action:none;pointer-events:auto;cursor:ns-resize;overflow:hidden}
.slider.t{color:#46e0cc}
.slider.c{color:#ff7f90}
.sfill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v)*(100% - 14px) + 7px);background:currentColor;opacity:.35}
.shandle{position:absolute;left:3px;right:3px;height:14px;border-radius:7px;background:currentColor;bottom:calc(var(--v)*(100% - 14px))}
.smark{position:absolute;left:0;right:0;bottom:50%;height:2px;background:#fff;opacity:.85}
.sact{position:absolute;left:12px;right:12px;height:3px;border-radius:2px;background:#fff;bottom:calc(var(--a)*(100% - 14px) + 6px);opacity:.9}
.slab{font-size:12px;opacity:.85;white-space:nowrap}
.sval{font-size:13px;font-weight:600}
.tbtn{display:block;width:98px;height:98px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;
  font:inherit;font-size:17px;font-weight:700;line-height:1.2;margin:8px auto 8px;padding:0;pointer-events:auto;touch-action:none;cursor:pointer}
.p1 .tbtn.on{background:#46e0cc;color:#04231f;transform:scale(.95)}
.p2 .tbtn.on{background:#ff7f90;color:#2b0910;transform:scale(.95)}
.pbtns{display:flex;gap:6px;justify-content:center;pointer-events:auto}
.tb{border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font:inherit;padding:0 12px;height:34px;font-size:14px;touch-action:none}
.p1 .tb.on{background:#46e0cc;color:#04231f}
.p2 .tb.on{background:#ff7f90;color:#2b0910}
.panel .hint{font-size:12px;opacity:.75;margin-top:4px;line-height:1.4}
body.touch .hint{display:none}
#flash{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px rgba(255,40,60,.75);opacity:0;transition:opacity .45s}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,10,24,.5);overflow:auto;touch-action:pan-y}
#overlay.hide{display:none}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
  width:min(580px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card h1{margin:0 0 6px;font-size:40px;line-height:1;letter-spacing:-.5px}
.card .lead{margin:0 0 14px;font-size:18px;line-height:1.35}
.card p{margin:0 0 12px;line-height:1.45}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.role{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.7}
.role h2{margin:0 0 2px;font-size:19px}
.role.r1{border-left:5px solid var(--p1)} .role.r1 h2{color:var(--p1)}
.role.r2{border-left:5px solid var(--p2)} .role.r2 h2{color:var(--p2)}
.card kbd{border-color:var(--line);background:transparent;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--muted)}
.mbtn,#ovBtn{font:inherit;font-size:18px;font-weight:700;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mbtn.primary,#ovBtn{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.mbtn:focus-visible,#ovBtn:focus-visible,input:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
.modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.join{display:flex;gap:6px}
.join input{font:inherit;font-size:18px;width:130px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);text-transform:uppercase;letter-spacing:2px}
.netmsg{margin:10px 0 0;color:var(--muted);font-size:15px;min-height:1.2em}
.code{font-size:56px;font-weight:800;letter-spacing:6px;color:var(--p1);margin:6px 0 10px}
@media (max-width:560px){.roles{grid-template-columns:1fr}.card h1{font-size:32px}}
@media (max-height:520px){#readout{display:none}.panel{font-size:12px}}
@media (prefers-reduced-motion:reduce){#toast,#hpfill,#flash,#say{transition:none}.react{animation-duration:1.2s}}
/* compact HUD: keep the middle of the screen clear */
#loadwrap{bottom:auto;top:calc(max(10px,env(safe-area-inset-top)) + 88px);width:auto;max-width:72vw;padding:6px 12px;white-space:nowrap}
#loadwrap.on{display:flex;align-items:center;gap:10px}
#loadbar{flex:1;min-width:80px;margin:0}
#loadtxt{font-size:13px}
.pills{margin-top:0;gap:6px}
.pill{font-size:12px;padding:2px 8px}
#toast{top:calc(max(10px,env(safe-area-inset-top)) + 134px)}
#wait{top:calc(max(10px,env(safe-area-inset-top)) + 88px);font-size:15px;padding:8px 14px}
#say{bottom:12px;font-size:14px;padding:6px 12px;max-width:40vw}
body.touch #reactbar{display:none}
@media (max-height:520px){
  #reactbar{display:none}
  .tbtn{width:80px;height:80px;font-size:15px;margin:4px auto}
  .panel{padding:6px 10px}
  .panel h3{font-size:14px;margin:0}
  .pbtns .tb{height:30px}
}
#obM{font-size:12px;opacity:.7;margin-top:2px}
#toast{top:auto;bottom:12px;font-size:14px;padding:6px 12px;max-width:44vw}
#say{bottom:52px}
#wait{top:calc(max(10px,env(safe-area-inset-top)) + 10px)}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="objective" class="glass">
    <div id="arrow"><svg viewBox="0 0 24 24"><path id="arrowPath" d="M12 2 L20 21 L12 16 L4 21 Z" fill="#a6e35a" stroke="rgba(0,0,0,.4)" stroke-width="1"/></svg></div>
    <div><div id="obT">Pick up the passengers</div><div id="obS"></div><div id="obM"></div></div>
  </div>
  <div id="net" class="glass"><i></i><span id="netTxt"></span><button id="leaveBtn">Leave</button></div>

  <button id="fsBtn" aria-label="Full screen">&#x26F6;</button>

    <div><span>Height</span><b id="alt">0 m</b></div>

</div>

<div id="overlay"><div class="card" id="card"></div></div>
<div id="rotate"><div class="ricon">&#128241;</div><div>Rotate your phone to landscape</div><button class="mbtn primary" id="rotBtn">Go full screen</button><small id="iosHint" style="display:none">On iPhone, tap Share, then Add to Home Screen, and open it from there for true full screen.</small></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const PI = Math.PI;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=x=>Math.round(x*100)/100,r3=x=>Math.round(x*1000)/1000;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- meme content ---------- */
const PASS=[
  {e:'🐕',lines:['wow. such altitude.','much fly. very drone.','such pilots. much skill.','so rooftop. wow.']},
  {e:'🐸',lines:['it is wednesday, my dudes','rare pilots. much wow.','ribbit. i mean mayday.','this is a lily pad now']},
  {e:'🗿',lines:['no thoughts. head empty.','...','stone cold. unbothered.','i am the cargo and i am calm']},
  {e:'🐱',lines:['i can haz altitude?','meow means mayday','pushing the pad off the roof in 3, 2...','cat-itude: 100%']},
  {e:'🦆',lines:['quack. mayday. quack.','this is a duck air force','we made it? quack.','not a goose. calm.']},
  {e:'🦄',lines:['sparkle protocol engaged','is this unicorn certified?','neigh. i mean hello.','rainbow landing gear?']}
];
const COMMON=['Does this thing have Wi-Fi?','Why are we sideways?','I left the stove on.','Left fan, more power!','Right fan, you are slacking!','I trust you both. Mostly.','Are we there yet?','Hold my coffee.','Is it normal to hear that noise?'];
const MEME_TEXTS=['SUCH CITY','MUCH ALTITUDE','VERY DRONE','TOUCH GRASS','NO CAP','BUY HIGH SELL LOW','WIFI: PASSWORD123','STONKS','THIS IS FINE','PILOT ERROR','NOT A HELIPAD','SKILL ISSUE','MORE FAN','TWO FANS ONE BRAIN'];
const WIN_TITLES=['Stonks 📈','Absolute cinema 🎬','Big W 🏆','Nailed it 😎','We are so back 🚁'];
const LOSE_TITLES=['Skill issue 💀','Task failed successfully','Bruh 🗿','That is going to leave a mark','Drone go brrr... then splat'];
const HURT_LINES=['Bruh.','Oof. 🗿','Insurance does not cover this','Skill issue?','Was that the building or the ground?'];
const REACT=['🗿','😂','💀','🔥','🐸'];
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const IMPACT='Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif';

/* ---------- canvas ---------- */
const cv=$('gl'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
addEventListener('resize',resize);resize();
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- world ---------- */
const G=320,GROUND=900,HXD=95,HT=44,HB=42;
const TINTS=['#59637f','#6a7390','#7b6f73','#4f5c7a','#6f7893','#5b6d77'];
let world={W:3000,blds:[],ledges:[],boxes:[],pads:[],signs:[],far:[],mid:[],clouds:[],stars:[]};
let pickup=null,dest=null;
let pass=PASS[0];

function genWorld(lvl,seed){
  const r=mulberry32(seed);
  const specs=[];let total=200;const worldW=2600+lvl*450;
  while(total<worldW){
    const gap=r()<0.3?50+r()*110:0;
    const w=170+r()*230;
    const h=150+r()*(280+Math.min(lvl,6)*45);
    specs.push({gap,w,h});total+=gap+w;
  }

  boxes.push({minX:-1200,maxX:0,minY:-3000,maxY:GROUND+900,pad:null,wall:true});
  boxes.push({minX:Wd,maxX:Wd+1200,minY:-3000,maxY:GROUND+900,pad:null,wall:true});

const model={visible:true};

/* ---------- physics ---------- */
function supportBelow(){
  let y=Infinity,b0=null;
  for(const b of world.boxes){
    if(d.x+HXD<=b.minX||d.x-HXD>=b.maxX||b.wall)continue;
    if(b.minY>=d.y+HB-2&&b.minY<y){y=b.minY;b0=b;}
  }
  return {y,b:b0};
}
function hurt(amount){
  if(amount<0.5||state!=='play')return;
  d.hp=0;
  fire({e:'hurt',a:30,m:pick(HURT_LINES)});
  fire({e:'crash'});
}
function collide(){
  let grounded=false,surf=null;
  for(const b of world.boxes){
    const L=d.x-HXD,R=d.x+HXD,T=d.y-HT,B=d.y+HB;
    if(R<=b.minX||L>=b.maxX||T>=b.maxY||B+0.5<=b.minY)continue;
    const ox=Math.min(R-b.minX,b.maxX-L),oyTop=B-b.minY,oyBot=b.maxY-T;
    if(oyTop<=ox&&oyTop<=oyBot){
      if(d.vy>0){
        const bad=d.vy>170||Math.abs(d.vx)>130||Math.abs(d.th)>0.4;
        if(bad&&d.vy>60){
          hurt(clamp(Math.max(0,d.vy-170)*0.12+Math.max(0,Math.abs(d.th)-0.4)*30+Math.max(0,Math.abs(d.vx)-130)*0.08,6,40));
          d.y=b.minY-HB;d.vy=-d.vy*0.3;d.w+=(Math.random()-.5)*3;continue;
        }
        d.vy=0;
      }
      d.y=b.minY-HB;
      if(d.vy>=0){grounded=true;surf=b;}
    }else if(oyBot<=ox){
      d.y=b.maxY+HT;
      if(d.vy<0){if(-d.vy>60)hurt(30);d.vy=-d.vy*0.2;}
    }else{
      const dir=d.x<(b.minX+b.maxX)/2?-1:1;d.x+=dir*ox;
      const vn=d.vx*dir;
      if(vn<0){if(-vn>55&&!b.wall)hurt(30);d.vx-=1.3*vn*dir;if(b.wall)toast('Stay inside the city');}
    }
  }
  d.grounded=grounded;d.surf=surf;
}

function step(dt,inp){
  d.time+=dt;
  for(let i=0;i<2;i++){const tgt=d.lv[i]?1:0;d.pr[i]+=(tgt-d.pr[i])*(1-Math.exp(-(tgt>d.pr[i]?9:4)*dt));}

  const A=(fl+fr)*G*0.8;
  const ax=A*Math.sin(d.th)+(d.grounded?0:windNow);
  const ay=G-A*Math.cos(d.th);
  d.vx+=ax*dt;d.vy+=ay*dt;
  const drag=Math.exp(-1.1*dt);d.vx*=drag;d.vy*=drag;
  if(d.grounded){
    d.vx*=Math.exp(-6*dt);

    d.w+=(4.2*(fl-fr)-6*d.th-4.2*d.w)*dt;d.th+=d.w*dt;

  const speed=Math.hypot(d.vx,d.vy);
  const target=phase==='pickup'?pickup:dest;
  const onPad=d.grounded&&d.surf&&d.surf.pad===target&&Math.abs(d.x-target.cx)<target.half;
  ui.p1=inp.l1;ui.p2=inp.l2;
  if(onPad&&speed<25){
    ui.loadOn=true;
    if(inp.l1&&inp.l2)loadProg+=dt/2.2;else loadProg=Math.max(0,loadProg-dt*0.7);
    if(loadProg>=1)completeStop();
  }else{ui.loadOn=false;loadProg=Math.max(0,loadProg-dt*1.5);}
  memes(dt,speed);
}
function memes(dt,speed){
  const once=(k,fn)=>{if(!mf[k]){mf[k]=1;fn();}};
  if(d.grounded&&d.surf&&!d.surf.pad&&!d.surf.ground)once('roof',()=>fire({e:'toast',s:'Sir, this is not a helipad 🗿'}));
  if(d.grounded&&d.surf&&d.surf.ground)once('grass',()=>fire({e:'toast',s:'Touch grass 🌱'}));
  if(d.y<GROUND-1100)once('high',()=>fire({e:'toast',s:'Why are we this high? 😳'}));
  if(speed>340)once('fast',()=>fire({e:'toast',s:'Zoom zoom 🚀'}));
  if(Math.abs(d.w)>3)once('spin',()=>fire({e:'toast',s:'Ragdoll spin cycle activated 🌀'}));
  if(Math.abs(d.th)>0.8)once('side',()=>fire({e:'toast',s:'We are basically sideways. This is fine.'}));
  if(d.hp<30)once('low',()=>fire({e:'toast',s:'This is fine. 🔥'}));
  if(d.pr[0]>0.97&&d.pr[1]>0.97)once('max',()=>fire({e:'toast',s:'MAX FANS. Hold on to your propeller hats 🎩'}));
  if(phase==='pickup'&&Math.hypot(d.x-pickup.cx,d.y-pickup.top)<500)once('near',()=>fire({e:'say',em:pass.e,s:'Over here!! Pick me up!'}));
  if(loaded){sayTimer-=dt;if(sayTimer<=0){sayTimer=9+Math.random()*7;fire({e:'say',em:pass.e,s:pick(pass.lines.concat(COMMON))});}}
}
function completeStop(){
  loadProg=0;
  if(phase==='pickup'){phase='deliver';loaded=true;sayTimer=6;fire({e:'chime'});fire({e:'toast',s:'Passengers aboard. Lift off together.'});}
  else finish();
}
function finish(){
  const dist=Math.abs(pickup.cx-dest.cx);
  const pts=Math.round(Math.max(150,1200+level*100-d.time*6-(100-d.hp)*6));
  totalScore+=pts;
  fire({e:'win',pts,total:totalScore,time:d.time,hp:d.hp,dist:dist/10,level});
}

/* ---------- audio ---------- */
let audio=null,muted=false;
// fan sound: airy noise whoosh plus a soft mid-range hum per fan, panned left and right.
// Phone speakers cannot play deep bass, so everything lives between about 150 Hz and 2 kHz.
function noiseBuffer(c){
  const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),o=b.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<n;i++){
    const w=Math.random()*2-1;
    b0=0.99*b0+w*0.06;b1=0.96*b1+w*0.3;b2=0.57*b2+w*1.05;
    o[i]=(b0+b1+b2+w*0.2)*0.25;
  }
  return b;
}
function initAudio(){
  if(audio){if(audio.ctx.state==='suspended'&&!muted)audio.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx2=new AC();
  const master=ctx2.createGain();master.gain.value=0.9;
  const soft=ctx2.createBiquadFilter();soft.type='lowpass';soft.frequency.value=3800;
  const comp=ctx2.createDynamicsCompressor();
  master.connect(soft);soft.connect(comp);comp.connect(ctx2.destination);
  const nb=noiseBuffer(ctx2);
  const fans=[-0.55,0.55].map((pan,i)=>{
    const src=ctx2.createBufferSource();src.buffer=nb;src.loop=true;
    const bp=ctx2.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=0.7;
    const ng=ctx2.createGain();ng.gain.value=0;
    const o=ctx2.createOscillator();o.type='triangle';o.frequency.value=160+i*7;
    const og=ctx2.createGain();og.gain.value=0;
    src.connect(bp);bp.connect(ng);o.connect(og);
    let out=master;
    if(ctx2.createStereoPanner){const p=ctx2.createStereoPanner();p.pan.value=pan;p.connect(master);out=p;}
    ng.connect(out);og.connect(out);
    src.start(0,Math.random()*1.5);o.start();
    return {bp,ng,o,og};
  });
  audio={ctx:ctx2,master,fans};
}
function toggleMute(){muted=!muted;if(audio)audio.ctx[muted?'suspend':'resume']();toast(muted?'Sound off':'Sound on',1000);}
function updateAudio(){
  if(!audio||muted)return;
  const t=audio.ctx.currentTime,on=(state==='play'||state==='won');
  audio.fans.forEach((f,i)=>{
    const sp=on?clamp(d.pr[i]||0,0,1):0;
    f.ng.gain.setTargetAtTime(on?0.02+0.55*sp:0,t,0.08);
    f.og.gain.setTargetAtTime(on?0.012+0.1*sp:0,t,0.08);
    f.bp.frequency.setTargetAtTime(420+1500*sp,t,0.08);
    f.o.frequency.setTargetAtTime(150+150*sp+i*7,t,0.08);
  });
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!audio||muted)return;const c=audio.ctx,t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
}
const thump=v=>tone('square',110,28,0.3,v);
function chime(){[660,880,1175].forEach((f,i)=>tone('sine',f,f,0.4,0.16,i*0.12));}
function womp(){[[311,0],[294,0.35],[277,0.7],[233,1.05]].forEach(([f,dl],i)=>tone('sawtooth',f,f*(i===3?0.7:0.97),i===3?0.9:0.32,0.12,dl));}
function boom(){tone('sine',90,25,0.7,0.5);}

const elx={wait:$('wait'),leave:$('leaveBtn'),voice:$('voice'),mic:$('micBtn'),spk:$('spkBtn'),vstat:$('vstat')};

function connectRoom(first){
  goFullscreen();
  if(net.ws)return;
  const url=normURL($('srv')&&$('srv').value);
  try{localStorage.setItem(SRV_KEY,url);}catch(e){}
  net.url=url;net.first=first;net.closing=false;net.retry=0;net.selfLost=false;net.joinedOnce=false;net.code=first.t==='join'?first.code:'';
  netMsg('Connecting to '+url+' ...');
  openWS();
}
function openWS(){
  let ws;
  try{ws=new WebSocket(net.url);}catch(e){resetToMenu('That server address is not valid.');return;}
  net.ws=ws;
  const guard=setTimeout(()=>{if(ws.readyState!==1){try{ws.close();}catch(e){}}},8000);
  ws.onopen=()=>{
    clearTimeout(guard);
    const hello=net.first?Object.assign({pid:getPid()},net.first):{t:'join',code:net.code,pid:getPid()};
    ws.send(JSON.stringify(hello));
  };
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}onServer(m);};
  ws.onclose=()=>{clearTimeout(guard);if(net.ws!==ws)return;net.ws=null;onWsClose();};
  ws.onerror=()=>{};
}
function onWsClose(){
  if(net.closing)return;
  if(!net.joinedOnce){resetToMenu('Could not reach the game server at '+net.url+'.');return;}
  net.retry++;
  if(net.retry>20){resetToMenu('Lost connection to the game server.');return;}
  net.selfLost=true;net.freeze=true;
  setTimeout(()=>{if(!net.closing&&!net.ws)openWS();},1500);
}
function onServer(m){
  switch(m.t){
    case 'joined':onJoined(m);break;
    case 'peer':onPeer(m);break;
    case 'host':onHost(m);break;
    case 'rtc':onRtc(m);break;
    case 'error':{
      net.closing=true;const ws=net.ws;net.ws=null;try{ws&&ws.close();}catch(e){}
      resetToMenu(m.code==='nofound'?'No room with that code.':m.code==='full'?'That room is full.':'The server is busy. Try again in a moment.');
      break;
    }
    default:onData(m);
  }
}
function onJoined(m){
  net.joinedOnce=true;
  net.code=m.code;net.seat=m.seat;net.first=null;net.peer=m.peers.slice();net.peer[m.seat]='online';
  net.mode=m.host?'host':'guest';net.freeze=false;net.selfLost=false;net.remote={a:0,load:false};
  hideBanner();seatClasses();
  if(!net.inT)net.inT=setInterval(()=>{if(net.mode==='guest')sendNet(guestInputs());},33);
  if(m.resume&&m.resume.lvl){
    const L=m.resume.lvl;seedBase=L.seedBase;totalScore=L.total;
    if(state==='menu'||level!==L.level)loadLevel(L.level);
    d.hp=L.hp;
    if(m.resume.snap){snap.has=false;applySnap(m.resume.snap);}
    if(state!=='play')startPlay();
  }else if(net.mode==='host'){showRoomOverlay(m.code);}
  else{
    showOverlay('<h1>Connected</h1><p class="lead">Waiting for the host to launch the drone.</p><button class="mbtn" id="bCancel">Leave</button>');
    $('bCancel').onclick=leaveRoom;
  }
  if(m.peers[1-m.seat]==='online')voiceStart();
}
function showRoomOverlay(code){
  showOverlay('<h1>Room</h1><div class="code">'+code+'</div><p class="lead">Send this code to your friend.</p>'+
    '<p>They open the game, type the code next to Join, and tap Join. Voice chat starts once you are both in. You can start flying now and they can join at any time.</p>'+
    '<button class="mbtn primary" id="bGo">Start flying</button> <button class="mbtn" id="bCopy">Copy code</button> <button class="mbtn" id="bCancel">Leave</button>');
  $('bGo').onclick=()=>{loadLevel(1);seatClasses();startPlay();};
  $('bCancel').onclick=leaveRoom;
  $('bCopy').onclick=()=>{try{navigator.clipboard.writeText(code);$('bCopy').textContent='Copied';}catch(e){$('bCopy').textContent=code;}};
}
function onPeer(m){
  const prev=net.peer[m.seat];net.peer[m.seat]=m.state;
  if(m.seat===net.seat)return;
  if(m.state==='waiting'){
    net.freeze=true;net.waitUntil=performance.now()+(m.secs||10)*1000;voiceClose(false);
    toast('Your teammate lost connection',2500);
  }else if(m.state==='online'){
    net.freeze=false;hideBanner();seatClasses();
    toast(prev==='waiting'?'Your teammate is back':'Your teammate joined',2200);
    if(net.mode==='host'){
      if(state==='menu'){loadLevel(1);startPlay();}
      syncLevel();sendSnap();
    }
    voiceStart();
  }else if(m.state==='left'){
    net.freeze=false;net.remote={a:0,load:false};hideBanner();seatClasses();voiceClose(false);
    toast('Your teammate left. You now fly both fans.',4000);
  }
}
function onHost(m){
  if(m.seat===net.seat&&net.mode==='guest'){
    net.mode='host';net.freeze=false;snapT=0;seatClasses();
    toast('You are now running the game',3000);
    if((state==='won'||state==='lost')&&lastResult)resultOverlay(lastResult.html,lastResult.btn,lastResult.action);
  }
}
function updateNetUI(){
  if(net.mode==='local'){hideBanner();elx.voice.classList.remove('on');return;}
  if(net.selfLost)showBanner('Connection lost. Reconnecting...');
  else if(net.freeze){
    const secs=Math.max(0,Math.ceil((net.waitUntil-performance.now())/1000));
    showBanner('Your teammate lost connection. Waiting '+secs+' s before you take over.');
  }else hideBanner();
  elx.voice.classList.add('on');
  voiceMeters();
}
function onData(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'in':if(net.mode==='host'){const rm=net.remote;rm.a=m.a?1:0;rm.load=!!m.load;}break;
    case 's':if(net.mode==='guest')applySnap(m);break;
    case 'lvl':if(net.mode==='guest'){seedBase=m.seedBase;loadLevel(m.level);d.hp=m.hp;totalScore=m.total;startPlay();}break;
    case 'ev':if(net.mode==='guest'&&m.m)handleEvent(m.m);break;
    case 'react':if(REACT.includes(m.em))spawnReact(m.em,m.who==='p1'||m.who==='p2'?m.who:'');break;
  }
}
function sendSnap(){
  if(net.mode!=='host'||!net.ws||net.ws.readyState!==1)return;
  sendNet({t:'s',x:r2(d.x),y:r2(d.y),vx:r2(d.vx),vy:r2(d.vy),th:r3(d.th),w:r3(d.w),pr:d.pr.map(r3),hp:Math.round(d.hp*10)/10,
    ph:phase,ld:loaded?1:0,lp:r3(loadProg),tm:r2(d.time),sc:totalScore,wm:r2(windNow),lw:ui.loadOn?1:0,k1:ui.p1?1:0,k2:ui.p2?1:0,g:d.grounded?1:0});
}
function applySnap(m){
  snap.x=m.x;snap.y=m.y;snap.vx=m.vx;snap.vy=m.vy;snap.th=m.th;snap.t=performance.now();
  if(!snap.has){d.x=m.x;d.y=m.y;d.th=m.th;snap.has=true;}
  d.w=m.w;d.pr=m.pr.slice();d.hp=m.hp;phase=m.ph;loaded=!!m.ld;loadProg=m.lp;d.time=m.tm;totalScore=m.sc;windNow=m.wm;
  ui.loadOn=!!m.lw;ui.p1=!!m.k1;ui.p2=!!m.k2;d.grounded=!!m.g;d.vx=m.vx;d.vy=m.vy;
}

/* ---------- voice chat (WebRTC audio, signalled through the game server) ---------- */
// For strict networks add a TURN server here, e.g. {urls:'turn:your.host:3478',username:'user',credential:'pass'}
const ICE_SERVERS=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
const voice={pc:null,sender:null,stream:null,track:null,remote:null,ctx:null,aLocal:null,aRemote:null,pend:[],audio:null,deaf:false,micOn:false,status:''};
function voiceCtx(){
  if(!voice.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)voice.ctx=new AC();}
  if(voice.ctx&&voice.ctx.state==='suspended')voice.ctx.resume();
  return voice.ctx;
}
function mkAnalyser(stream){
  const c=voiceCtx();if(!c)return null;
  const src=c.createMediaStreamSource(stream),an=c.createAnalyser();an.fftSize=256;src.connect(an);
  return {an,buf:new Uint8Array(an.fftSize)};
}
function lvlOf(a){
  if(!a)return 0;a.an.getByteTimeDomainData(a.buf);let sum=0;
  for(let i=0;i<a.buf.length;i++){const v=(a.buf[i]-128)/128;sum+=v*v;}
  return Math.sqrt(sum/a.buf.length);
}
function setVoiceStatus(st){
  voice.status=st;
  const map={connecting:'connecting...',connected:'connected',failed:'no link',unsupported:'not supported',off:''};
  elx.vstat.textContent=map[st]||'';
}
function updateVoiceBtns(){
  elx.mic.textContent='\uD83C\uDFA4 '+(!voice.stream?'Mic off':voice.micOn?'Mic on':'Muted');
  elx.mic.classList.toggle('live',voice.micOn);
  elx.spk.textContent=voice.deaf?'\uD83D\uDD07':'\uD83D\uDD0A';
}
function voiceClose(full){
  if(voice.pc){try{voice.pc.close();}catch(e){}}
  voice.pc=null;voice.sender=null;voice.remote=null;voice.aRemote=null;voice.pend=[];
  if(voice.audio){try{voice.audio.srcObject=null;}catch(e){}}
  setVoiceStatus('off');
  if(full&&voice.stream){voice.stream.getTracks().forEach(t=>t.stop());voice.stream=null;voice.track=null;voice.aLocal=null;voice.micOn=false;}
  updateVoiceBtns();
}
function ensurePC(makeTransceiver){
  voiceClose(false);
  const pc=new RTCPeerConnection({iceServers:ICE_SERVERS});voice.pc=pc;
  pc.onicecandidate=e=>{if(e.candidate)sendNet({t:'rtc',k:'ice',c:e.candidate});};
  pc.ontrack=e=>{
    voice.remote=e.streams[0]||new MediaStream([e.track]);
    if(!voice.audio){voice.audio=new Audio();voice.audio.autoplay=true;}
    voice.audio.srcObject=voice.remote;voice.audio.muted=voice.deaf;
    voice.audio.play().catch(()=>{});
    voice.aRemote=mkAnalyser(voice.remote);
  };
  pc.onconnectionstatechange=()=>{
    const cs=pc.connectionState;
    setVoiceStatus(cs==='connected'?'connected':cs==='failed'?'failed':'connecting');
  };
  if(makeTransceiver){voice.sender=pc.addTransceiver('audio',{direction:'sendrecv'}).sender;}
  if(voice.track&&voice.sender)voice.sender.replaceTrack(voice.track).catch(()=>{});
  setVoiceStatus('connecting');
  return pc;
}
// seat 0 makes the offer; seat 1 answers
async function voiceStart(){
  if(typeof RTCPeerConnection==='undefined'){setVoiceStatus('unsupported');return;}
  if(net.seat!==0||net.mode==='local')return;
  try{
    const pc=ensurePC(true);
    await pc.setLocalDescription(await pc.createOffer());
    sendNet({t:'rtc',k:'offer',sdp:pc.localDescription});
  }catch(e){setVoiceStatus('failed');}
}
async function onRtc(m){
  if(typeof RTCPeerConnection==='undefined')return;
  try{
    if(m.k==='offer'){
      const pc=ensurePC(false);
      await pc.setRemoteDescription(m.sdp);
      for(const c of voice.pend)await pc.addIceCandidate(c).catch(()=>{});
      voice.pend=[];
      const tr=pc.getTransceivers().find(t=>t.receiver&&t.receiver.track&&t.receiver.track.kind==='audio');
      if(tr){tr.direction='sendrecv';voice.sender=tr.sender;if(voice.track)await voice.sender.replaceTrack(voice.track);}
      await pc.setLocalDescription(await pc.createAnswer());
      sendNet({t:'rtc',k:'answer',sdp:pc.localDescription});
    }else if(m.k==='answer'&&voice.pc){
      await voice.pc.setRemoteDescription(m.sdp);
      for(const c of voice.pend)await voice.pc.addIceCandidate(c).catch(()=>{});
      voice.pend=[];
    }else if(m.k==='ice'){
      if(voice.pc&&voice.pc.remoteDescription)await voice.pc.addIceCandidate(m.c).catch(()=>{});
      else voice.pend.push(m.c);
    }
  }catch(e){setVoiceStatus('failed');}
}
async function toggleMic(){
  if(net.mode==='local'){toast('Voice chat works in online rooms',1800);return;}
  if(!voice.stream){
    try{
      voice.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      voice.track=voice.stream.getAudioTracks()[0];voice.aLocal=mkAnalyser(voice.stream);voice.micOn=true;
      if(voice.sender)await voice.sender.replaceTrack(voice.track);
    }catch(e){
      voice.stream=null;voice.track=null;voice.micOn=false;
      toast('Mic unavailable. Allow the microphone, and use HTTPS or localhost.',3800);
    }
  }else{voice.micOn=!voice.micOn;voice.track.enabled=voice.micOn;}
  updateVoiceBtns();
}
elx.mic.onclick=toggleMic;
elx.spk.onclick=()=>{voice.deaf=!voice.deaf;if(voice.audio)voice.audio.muted=voice.deaf;updateVoiceBtns();};
elx.leave.onclick=leaveRoom;
let meterT=0;
function voiceMeters(){
  const now=performance.now();if(now-meterT<100)return;meterT=now;
  const mine=voice.micOn&&lvlOf(voice.aLocal)>0.04,theirs=!voice.deaf&&lvlOf(voice.aRemote)>0.04;
  panels.forEach((p,i)=>{
    const isMine=!isSolo()&&i===net.seat;
    p.classList.toggle('speaking',isMine?mine:(!isSolo()&&theirs));
  });
}
updateVoiceBtns();

/* ---------- camera, HUD, minimap, loop ---------- */
function updateCamera(dt){
  const tx=d.x+d.vx*0.3,ty=d.y-40+d.vy*0.15;
  const k=1-Math.exp(-4*dt);
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  if(shake>0)shake=Math.max(0,shake-dt*2);
}
let mapStatic=null;
function buildMapStatic(){
  mapStatic=document.createElement('canvas');mapStatic.width=360;mapStatic.height=144;const x=mapStatic.getContext('2d');
  x.fillStyle='#10142a';x.fillRect(0,0,360,144);
  const sx=360/world.W,sy=144/(GROUND+400),top=300;
  world.blds.forEach(b=>{x.fillStyle='hsl(235,22%,'+Math.round(24+(b.h/600)*30)+'%)';x.fillRect(b.minX*sx,(b.minY+top)*sy,b.w*sx,(GROUND-b.minY)*sy);});
  x.fillStyle='#8b93ad';world.ledges.forEach(l=>x.fillRect(l.minX*sx,(l.minY+top)*sy,Math.max(3,(l.maxX-l.minX)*sx),3));
}
function drawMap(t){
  if(!mapStatic)buildMapStatic();
  const mc=$('map').getContext('2d');mc.drawImage(mapStatic,0,0);
  const sx=360/world.W,sy=144/(GROUND+400),top=300;
  [pickup,dest].forEach(p=>{
    const act=phase===p.name;mc.fillStyle=p.color;mc.globalAlpha=act?1:0.55;
    mc.beginPath();mc.arc(p.cx*sx,(p.top+top)*sy-6,act?8+2*Math.sin(t*5):6,0,PI*2);mc.fill();
    mc.globalAlpha=1;mc.strokeStyle='#0b0e1f';mc.lineWidth=2;mc.stroke();
  });
  mc.fillStyle='#fff';mc.strokeStyle='#0b0e1f';mc.lineWidth=2;
  mc.beginPath();mc.arc(d.x*sx,(d.y+top)*sy,6,0,PI*2);mc.fill();mc.stroke();
}
function updateHUD(){
  const tgt=phase==='pickup'?pickup:dest;
  const dx=tgt.cx-d.x,dy=tgt.top-d.y,dist=Math.hypot(dx,dy);
  el.arrow.style.transform='rotate('+Math.atan2(dx,-dy)+'rad)';
  el.arrowPath.setAttribute('fill',tgt.color);
  el.obT.textContent=phase==='pickup'?'Pick up the passengers':'Deliver to the gold pad';
  let sub=(phase==='pickup'?'Green pad, ':'Gold pad, ')+Math.round(dist/10)+' m away';
  if(d.grounded&&(d.pr[0]+d.pr[1])/2<0.52&&dist>250)sub='Hold both thrust buttons together to lift off';
  el.obS.textContent=sub;
  el.obM.textContent='City '+level+'   '+fmtTime(d.time)+'   '+totalScore+' pts';
  const sup=supportBelow(),alt=sup.y===Infinity?0:Math.max(0,sup.y-(d.y+HB));
  el.alt.textContent=Math.round(alt/10)+' m';
  el.spd.textContent=Math.round(Math.hypot(d.vx,d.vy)/10)+' m/s';
  el.tilt.textContent=Math.round(d.th*180/PI)+'\u00b0';
  el.wind.textContent=windS<1?'Calm':(windNow>=0?'\u2192 ':'\u2190 ')+Math.round(Math.abs(windNow)/6)+' m/s';
  let land='-',col='';
  if(alt<160&&!d.grounded){
    const ok=d.vy<170&&Math.abs(d.vx)<130&&Math.abs(d.th)<0.4;
    land=ok?'OK':(d.vy>=170?'too fast':Math.abs(d.th)>=0.4?'too tilted':'too sideways');col=ok?'#a6e35a':'#ffc857';
  }else if(d.grounded){land='landed';col='#a6e35a';}
  el.land.textContent=land;el.land.style.color=col;
  
}
function renderLoadUI(){}

/* ---------- full screen and landscape for phones ---------- */
const coarse=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const fsEl=document.documentElement;
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
async function lockLandscape(){try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}}
async function goFullscreen(force){
  if(!coarse&&force!==true)return;
  try{
    if(!isFS()){const rq=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;if(rq)await rq.call(fsEl,{navigationUI:'hide'});}
  }catch(e){}
  lockLandscape();
}
function toggleFullscreen(){
  if(isFS()){const ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex)ex.call(document);}
  else goFullscreen(true);
}
function fsChanged(){
  const on=isFS(),b=$('fsBtn');
  b.textContent=on?'\u2715':'\u26F6';b.setAttribute('aria-label',on?'Exit full screen':'Full screen');
  if(on)lockLandscape();
  setTimeout(resize,150);
}
document.addEventListener('fullscreenchange',fsChanged);
document.addEventListener('webkitfullscreenchange',fsChanged);
addEventListener('orientationchange',()=>setTimeout(resize,250));
addEventListener('resize',()=>setTimeout(resize,100));
$('fsBtn').onclick=toggleFullscreen;
$('rotBtn').onclick=()=>goFullscreen(true);
const ua=(navigator.userAgent||'');
if(/iPhone|iPod/.test(ua)&&!(navigator.standalone))$('iosHint').style.display='block';
// browsers only allow full screen from a tap, so the first tap on a phone does it
let fsTried=false;
if(coarse)document.addEventListener('pointerup',()=>{if(!isFS()&&!fsTried){fsTried=true;goFullscreen();}},{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());
// keep the screen on while flying so the connection is not dropped
let wake=null;
async function keepAwake(){
  try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state==='play')keepAwake();});

showMenu();
loadLevel(1);

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(!paused)clock+=dt;
  if(state==='play'&&!paused)applyKeyLevers(dt);
  updateSliders();updateNetUI();
  if(!paused){
    if(state==='play'){
      if(net.mode==='guest'){
        if(snap.has){
          const age=Math.min((performance.now()-snap.t)/1000,0.25),k=1-Math.exp(-14*dt);
          d.x+=(snap.x+snap.vx*age-d.x)*k;d.y+=(snap.y+snap.vy*age-d.y)*k;d.th+=(snap.th-d.th)*k;
        }
      }else{
        if(!net.freeze)step(dt,readInputs());
        snapT+=dt;if(snapT>=0.05){snapT=0;sendSnap();}
      }
      hudT+=dt;if(hudT>0.08){hudT=0;updateHUD();}
      renderLoadUI();
    }else if(state!=='menu'){
      if(net.mode==='host'){snapT+=dt;if(snapT>=0.05){snapT=0;sendSnap();}}
      renderLoadUI();
    }
    updateAudio();updateVisuals(dt);updateDebris(dt);updateCamera(dt);
    if(state!=='menu')drawMap(clock);
  }
  draw();
}
requestAnimationFrame(frame);
})();
</script>
