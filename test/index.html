<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tandem Lift Online</title>
<style>
:root{
  --ink:#1b2036; --card:rgba(250,246,240,.97); --muted:#5b6078; --line:rgba(27,32,54,.2);
  --p1:#0f9a8a; --p2:#d63a51; --btn:#1b2036; --btnink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#eef0fa; --card:rgba(17,21,43,.96); --muted:#a7adc9; --line:rgba(238,240,250,.22);
    --p1:#46e0cc; --p2:#ff7f90; --btn:#eef0fa; --btnink:#11152b; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#11152b;color:#f3f5ff;
  font-family:'Avenir Next Condensed','Bahnschrift','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;font-variant-numeric:tabular-nums}
input{user-select:text;-webkit-user-select:text}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(12,16,36,.58);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);border-radius:12px}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#objective{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;display:flex;gap:10px;align-items:center;
  padding:8px 14px 8px 10px;max-width:min(310px,54vw)}
#arrow{width:34px;height:34px;flex:none;transition:transform .08s linear}
#arrow svg{width:100%;height:100%;display:block}
#obT{font-size:17px;font-weight:700;line-height:1.15}
#obS{font-size:13px;opacity:.85;margin-top:2px}
#net{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 70px);left:10px;padding:4px 10px;font-size:13px;display:none}
#net i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#46e0cc}
#vitals{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;gap:12px;align-items:center;padding:8px 14px;font-size:14px;white-space:nowrap}
#hp{width:90px;height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#hpfill{height:100%;width:100%;background:#a6e35a;transition:width .2s,background .2s}
#fan{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 46px);left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;padding:6px 14px;font-size:14px;white-space:nowrap}
#fanbar{position:relative;width:150px;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
#fanfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#8ecbff;width:30%}
#fanmark{position:absolute;left:50%;top:-4px;width:2px;height:18px;background:#fff;margin-left:-1px}
#fanst{min-width:48px;text-align:left}
#map{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;width:128px;height:128px;border-radius:12px;
  border:1px solid rgba(255,255,255,.2)}
#readout{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 136px);right:10px;width:128px;padding:6px 10px;font-size:13px;line-height:1.5}
#readout div{display:flex;justify-content:space-between}
#readout b{font-weight:600}
#loadwrap{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);width:min(320px,80vw);padding:12px 14px;text-align:center;display:none}
#loadwrap.on{display:block}
#loadbar{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;margin:8px 0}
#loadfill{height:100%;width:0;background:#ffc857}
#loadtxt{font-size:15px;font-weight:600}
.pills{display:flex;gap:8px;justify-content:center;margin-top:6px}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.3);opacity:.7}
#pl1.on{background:#46e0cc;color:#04231f;border-color:#46e0cc;opacity:1}
#pl2.on{background:#ff7f90;color:#2b0910;border-color:#ff7f90;opacity:1}
#toast{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 92px);transform:translate(-50%,-8px);
  padding:8px 16px;font-size:16px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;text-align:center;max-width:80vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#say{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);background:#fff;color:#14172a;padding:8px 16px;border-radius:18px;
  font:700 18px 'Comic Sans MS','Chalkboard SE','Comic Neue',cursive,sans-serif;opacity:0;transition:opacity .2s;max-width:80vw;text-align:center}
#say::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
#say.show{opacity:1}
#reactbar{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:5px 8px;pointer-events:auto}
#reactbar button{font-size:22px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);padding:0;cursor:pointer;touch-action:manipulation}
#reactbar button:active{background:rgba(255,255,255,.35)}
#reacts{position:absolute;inset:0;overflow:hidden}
.react{position:absolute;bottom:14%;font-size:44px;animation:rise 2.3s ease-out forwards}
.react.p1{text-shadow:0 0 14px #46e0cc,0 0 4px #46e0cc}
.react.p2{text-shadow:0 0 14px #ff7f90,0 0 4px #ff7f90}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-300px) scale(1);opacity:0}}
.panel{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));padding:10px 12px;font-size:14px;line-height:1.7;max-width:46vw}
.panel h3{margin:0 0 2px;font-size:16px}
.panel.p1{left:10px;border-left:4px solid #46e0cc}
.panel.p1 h3{color:#46e0cc}
.panel.p2{right:10px;border-right:4px solid #ff7f90;text-align:right}
.panel.p2 h3{color:#ff7f90}
body.online-p1 .panel.p2,body.online-p2 .panel.p1{display:none}
kbd{display:inline-block;min-width:22px;padding:0 6px;margin-right:3px;border-radius:5px;border:1px solid rgba(255,255,255,.35);
  border-bottom-width:2px;background:rgba(255,255,255,.1);font:inherit;font-size:13px;text-align:center}
.dpad{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;margin-top:6px;pointer-events:auto}
body.touch .dpad{display:grid}
body.touch .keys{display:none}
body.touch .panel{padding:8px 10px}
.tb{border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:20px;padding:0;touch-action:none}
.tb small{display:block;font-size:10px;opacity:.85;margin-top:-2px}
.p1 .tb.on{background:#46e0cc;color:#04231f}
.p2 .tb.on{background:#ff7f90;color:#2b0910}
#flash{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px rgba(255,40,60,.75);opacity:0;transition:opacity .45s}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,10,24,.5);overflow:auto;touch-action:pan-y}
#overlay.hide{display:none}
.card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
  width:min(580px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card h1{margin:0 0 6px;font-size:40px;line-height:1;letter-spacing:-.5px}
.card .lead{margin:0 0 14px;font-size:18px;line-height:1.35}
.card p{margin:0 0 12px;line-height:1.45}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.role{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.7}
.role h2{margin:0 0 2px;font-size:19px}
.role.r1{border-left:5px solid var(--p1)} .role.r1 h2{color:var(--p1)}
.role.r2{border-left:5px solid var(--p2)} .role.r2 h2{color:var(--p2)}
.card kbd{border-color:var(--line);background:transparent;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--muted)}
.mbtn,#ovBtn{font:inherit;font-size:18px;font-weight:700;padding:11px 20px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mbtn.primary,#ovBtn{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.mbtn:focus-visible,#ovBtn:focus-visible,input:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
.modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.join{display:flex;gap:6px}
.join input{font:inherit;font-size:18px;width:130px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);text-transform:uppercase;letter-spacing:2px}
.netmsg{margin:10px 0 0;color:var(--muted);font-size:15px;min-height:1.2em}
.code{font-size:56px;font-weight:800;letter-spacing:6px;color:var(--p1);margin:6px 0 10px}
@media (max-width:560px){.roles{grid-template-columns:1fr}.card h1{font-size:32px}}
@media (max-height:520px){#readout{display:none}.panel{font-size:12px}}
@media (prefers-reduced-motion:reduce){#toast,#hpfill,#flash,#say{transition:none}.react{animation-duration:1.2s}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="objective" class="glass">
    <div id="arrow"><svg viewBox="0 0 24 24"><path id="arrowPath" d="M12 2 L20 21 L12 16 L4 21 Z" fill="#a6e35a" stroke="rgba(0,0,0,.4)" stroke-width="1"/></svg></div>
    <div><div id="obT">Pick up the passengers</div><div id="obS"></div></div>
  </div>
  <div id="net" class="glass"><i></i><span id="netTxt"></span></div>
  <div id="vitals" class="glass"><span id="lv">City 1</span><span>Hull</span><div id="hp"><div id="hpfill"></div></div><span id="tm">0:00</span><span id="sc">0 pts</span></div>
  <div id="fan" class="glass"><span>Fan</span><div id="fanbar"><div id="fanfill"></div><div id="fanmark"></div></div><span id="fanst">idle</span></div>
  <canvas id="map" class="glass" width="320" height="320"></canvas>
  <div id="readout" class="glass">
    <div><span>Height</span><b id="alt">0 m</b></div>
    <div><span>Speed</span><b id="spd">0 m/s</b></div>
    <div><span>Vertical</span><b id="vs">0 m/s</b></div>
    <div><span>Wind</span><b id="wind">Calm</b></div>
  </div>
  <div id="loadwrap" class="glass">
    <div id="loadtxt">Hold both load keys</div>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div class="pills"><span class="pill" id="pl1">Pilot: E</span><span class="pill" id="pl2">Co-pilot: Enter</span></div>
  </div>
  <div id="toast" class="glass"></div>
  <div id="say"></div>
  <div id="reacts"></div>

  <div class="panel p1 glass">
    <h3>Pilot</h3>
    <div class="keys"><div><kbd>W</kbd><kbd>S</kbd> thrust</div><div><kbd>A</kbd><kbd>D</kbd> turn</div><div><kbd>E</kbd> hold to load</div></div>
    <div class="dpad">
      <span></span><button class="tb" data-k="KeyW">▲<small>fwd</small></button><span></span>
      <button class="tb" data-k="KeyA">◀<small>turn</small></button><button class="tb" data-k="KeyE"><small style="margin:0">load</small></button><button class="tb" data-k="KeyD">▶<small>turn</small></button>
      <span></span><button class="tb" data-k="KeyS">▼<small>back</small></button><span></span>
    </div>
  </div>
  <div id="reactbar" class="glass">
    <button data-r="0" aria-label="Moai">🗿</button><button data-r="1" aria-label="Laugh">😂</button><button data-r="2" aria-label="Skull">💀</button><button data-r="3" aria-label="Fire">🔥</button><button data-r="4" aria-label="Frog">🐸</button>
  </div>
  <div class="panel p2 glass">
    <h3>Co-pilot</h3>
    <div class="keys"><div>fan faster / slower <kbd>↑</kbd><kbd>↓</kbd></div><div>slide <kbd>←</kbd><kbd>→</kbd></div><div>auto-hover <kbd>Space</kbd></div><div>hold to load <kbd>Enter</kbd></div></div>
    <div class="dpad">
      <button class="tb" data-k="Space"><small style="margin:0">hover</small></button><button class="tb" data-k="ArrowUp">▲<small>fan up</small></button><span></span>
      <button class="tb" data-k="ArrowLeft">◀<small>slide</small></button><button class="tb" data-k="Enter"><small style="margin:0">load</small></button><button class="tb" data-k="ArrowRight">▶<small>slide</small></button>
      <span></span><button class="tb" data-k="ArrowDown">▼<small>fan down</small></button><span></span>
    </div>
  </div>
  <div id="flash"></div>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const PI = Math.PI;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function angDiff(a,b){let d=a-b;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=x=>Math.round(x*100)/100, r3=x=>Math.round(x*1000)/1000;

/* ---------- meme content ---------- */
const PASS=[
  {e:'🐕',lines:['wow. such altitude.','much fly. very helicopter.','such pilot. much skill.','so rooftop. wow.']},
  {e:'🐸',lines:['it is wednesday, my dudes','rare pilot. much wow.','ribbit. i mean mayday.','this is a lily pad now']},
  {e:'🗿',lines:['no thoughts. head empty.','...','stone cold. unbothered.','i am the cargo and i am calm']},
  {e:'🐱',lines:['i can haz altitude?','meow means mayday','pushing the pad off the roof in 3, 2...','cat-itude: 100%']},
  {e:'🦆',lines:['quack. mayday. quack.','this is a duck air force','we made it? quack.','not a goose. calm.']},
  {e:'🦄',lines:['sparkle protocol engaged','is this unicorn certified?','neigh. i mean hello.','rainbow landing gear?']}
];
const COMMON=['Does this thing have Wi-Fi?','Pilot, why are we sideways?','I left the stove on.','Co-pilot, more fan!','I trust you both. Mostly.','Are we there yet?','Hold my coffee.','Fasten your seatbelts. We have none.','Is it normal to hear that noise?'];
const MEME_TEXTS=['SUCH CITY','MUCH ALTITUDE','VERY HELICOPTER','TOUCH GRASS','NO CAP','BUY HIGH SELL LOW','WIFI: PASSWORD123','STONKS','THIS IS FINE','PILOT ERROR','NOT A HELIPAD','SKILL ISSUE','MORE FAN','LOOK MA NO HANDS'];
const WIN_TITLES=['Stonks 📈','Absolute cinema 🎬','Big W 🏆','Nailed it 😎','We are so back 🚁'];
const LOSE_TITLES=['Skill issue 💀','Task failed successfully','Bruh 🗿','That is going to leave a mark','Helicopter go brrr... then splat'];
const HURT_LINES=['Bruh.','Oof. 🗿','Insurance does not cover this','Skill issue?','Was that the building or the ground?'];
const REACT=['🗿','😂','💀','🔥','🐸'];

/* ---------- renderer / scene ---------- */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const FOG=0xd99a6c;
scene.fog=new THREE.Fog(FOG,160,950);
const camera=new THREE.PerspectiveCamera(64,1,1,1800);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,24,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color(0x141a3d)},mid:{value:new THREE.Color(0x7a5b86)},hor:{value:new THREE.Color(FOG)}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,mid,hor;varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);vec3 c=mix(hor,mid,smoothstep(0.,.22,h));c=mix(c,top,smoothstep(.18,.75,h));gl_FragColor=vec4(c,1.);}'
}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0x9aa6e6,0x3b2f3f,0.9));
const sun=new THREE.DirectionalLight(0xffb27a,1.0);sun.position.set(-300,110,-180);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshLambertMaterial({color:0x1d2130}));
ground.rotation.x=-PI/2;ground.position.y=-0.1;scene.add(ground);

/* ---------- textures, sprites, materials ---------- */
function makeWallTextures(){
  const S=256,cells=8,c=S/cells;
  const a=document.createElement('canvas');a.width=a.height=S;const x=a.getContext('2d');
  const b=document.createElement('canvas');b.width=b.height=S;const y=b.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,S,S);y.fillStyle='#000';y.fillRect(0,0,S,S);
  const r=mulberry32(99);
  for(let i=0;i<cells;i++)for(let j=0;j<cells;j++){
    const px=i*c+5,py=j*c+6,w=c-10,h=c-12;
    x.fillStyle='#39425a';x.fillRect(px,py,w,h);
    if(r()<0.42){y.fillStyle=r()<0.72?'#ffcf86':'#9fd8ff';y.fillRect(px,py,w,h);}
  }
  const t1=new THREE.CanvasTexture(a),t2=new THREE.CanvasTexture(b);
  [t1,t2].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;});
  return [t1,t2];
}
const [WALL_MAP,WALL_EMI]=makeWallTextures();
const TINTS=[0x8e97b8,0x9fa8bd,0xb9aaa2,0x7f8cab,0xa9b1c6,0x93a2a9];
const MATS=TINTS.map(c=>({
  wall:new THREE.MeshLambertMaterial({color:c,map:WALL_MAP,emissive:0xffffff,emissiveMap:WALL_EMI,emissiveIntensity:0.9}),
  roof:new THREE.MeshLambertMaterial({color:new THREE.Color(c).multiplyScalar(0.55)})
}));
function makeRoadTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle='#2c3040';x.fillRect(0,0,128,128);
  x.fillStyle='#e9c25a';x.fillRect(62,0,4,64);
  x.fillStyle='rgba(255,255,255,.5)';x.fillRect(5,0,2,128);x.fillRect(121,0,2,128);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t;
}
const ROAD_MAT=new THREE.MeshLambertMaterial({map:makeRoadTexture(),polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
const SIDE_MAT=new THREE.MeshLambertMaterial({color:0x5b6076,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
const PARK_MAT=new THREE.MeshLambertMaterial({color:0x35563f,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-3});
function padTexture(hex){
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  const col='#'+hex.toString(16).padStart(6,'0');
  x.lineWidth=14;x.strokeStyle=col;x.beginPath();x.arc(128,128,118,0,PI*2);x.stroke();
  x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.8)';x.beginPath();x.arc(128,128,96,0,PI*2);x.stroke();
  x.fillStyle='#fff';x.fillRect(86,70,20,116);x.fillRect(150,70,20,116);x.fillRect(86,118,84,20);
  return new THREE.CanvasTexture(c);
}
const emojiCache={};
function emojiTex(em){
  if(emojiCache[em])return emojiCache[em];
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  x.font='190px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText(em,128,138);
  return emojiCache[em]=new THREE.CanvasTexture(c);
}
function emojiSprite(em,s){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(em),transparent:true,depthWrite:false}));
  sp.scale.set(s,s,1);return sp;
}
function textSprite(text,w){
  const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
  let fs=84;const fam='Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif';
  x.font='bold '+fs+'px '+fam;
  while(x.measureText(text).width>480&&fs>20){fs-=4;x.font='bold '+fs+'px '+fam;}

function buildCity(lvl,seed){

  city=new THREE.Group();scene.add(city);buildings=[];parks=[];cars=[];carMesh=null;
  const r=mulberry32(seed);
  N=Math.min(7+Math.ceil(lvl/2),11);span=N*PITCH;
  const cc=i=>(i-(N-1)/2)*PITCH;
  const blocks=[];for(let i=0;i<N;i++)for(let j=0;j<N;j++)blocks.push({i,j,x:cc(i),z:cc(j)});
  const A=blocks[Math.floor(r()*blocks.length)];
  const minD=Math.min(140+lvl*50,span*0.75);
  let cands=blocks.filter(b=>Math.hypot(b.x-A.x,b.z-A.z)>=minD);
  if(!cands.length)cands=[blocks.slice().sort((p,q)=>Math.hypot(q.x-A.x,q.z-A.z)-Math.hypot(p.x-A.x,p.z-A.z))[0]];
  const B=cands[Math.floor(r()*cands.length)];

  const roadLen=span+16;
  ROAD_MAT.map.repeat.set(1,roadLen/16);
  for(let i=0;i<=N;i++){
    const pos=(i-N/2)*PITCH;
    const m1=new THREE.Mesh(new THREE.PlaneGeometry(16,roadLen),ROAD_MAT);
    m1.rotation.x=-PI/2;m1.position.set(pos,0.04,0);city.add(m1);
    const m2=new THREE.Mesh(new THREE.PlaneGeometry(16,roadLen),ROAD_MAT);
    m2.rotation.order='YXZ';m2.rotation.set(-PI/2,PI/2,0);m2.position.set(0,0.04,pos);city.add(m2);
  }
  const side=new THREE.InstancedMesh(PLANE_B,SIDE_MAT,blocks.length);side.frustumCulled=false;
  const trees=[];
  blocks.forEach((b,idx)=>{
    dummy.position.set(b.x,0.06,b.z);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);dummy.updateMatrix();side.setMatrixAt(idx,dummy.matrix);
    if(b===A||b===B){
      const h=24+r()*16+lvl*1.5;
      b.bd=addBuilding(b.x,b.z,34,34,h,Math.floor(r()*TINTS.length),r);return;
    }
    if(r()<0.11){
      const m=new THREE.Mesh(PLANE_P,PARK_MAT);m.position.set(b.x,0.08,b.z);city.add(m);
      parks.push(b);
      const n=10+Math.floor(r()*6);
      for(let k=0;k<n;k++)trees.push({x:b.x+(r()-.5)*36,z:b.z+(r()-.5)*36,s:0.8+r()*0.8});
      return;
    }
    const c=Math.max(0,1-Math.hypot(b.x,b.z)/(span*0.6));
    const hmax=26+c*85+lvl*4;
    const hgen=k=>9+Math.pow(r(),1.6)*hmax*k;
    const t=r(),tint=()=>Math.floor(r()*TINTS.length);
    if(t<0.3){
      addBuilding(b.x,b.z,35+r()*3,35+r()*3,hgen(1.1),tint(),r);
    }else if(t<0.62){
      const vert=r()<0.5;
      for(let k=0;k<2;k++){
        const off=(k?1:-1)*10.75;
        if(vert)addBuilding(b.x+off,b.z,18.5-r()*2,38-r()*3,hgen(1),tint(),r);
        else addBuilding(b.x,b.z+off,38-r()*3,18.5-r()*2,hgen(1),tint(),r);
      }
    }else{
      for(const dx of[-1,1])for(const dz of[-1,1])
        addBuilding(b.x+dx*10.5,b.z+dz*10.5,18-r()*2,18-r()*2,hgen(0.9),tint(),r);
    }

  side.instanceMatrix.needsUpdate=true;city.add(side);
  if(trees.length){

    const tm=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:0xffffff}),trees.length);tm.frustumCulled=false;
    const col=new THREE.Color();

  }

  const carCols=[0xd8dbe6,0xc94b4b,0x3f6fb5,0xe0b341,0x4a4f60,0x59a77d];const col=new THREE.Color();
  for(let i=0;i<CAR_N;i++){

    col.setHex(carCols[Math.floor(r()*carCols.length)]);carMesh.setColorAt(i,col);
  }
  carMesh.instanceColor.needsUpdate=true;city.add(carMesh);updateCars(0);
  // meme billboards on the rooftops

    const b=buildings[Math.floor(r()*buildings.length)];const txt=MEME_TEXTS[Math.floor(r()*MEME_TEXTS.length)];

    const sp=textSprite(txt,18);sp.position.set(b.x,b.top+7,b.z);city.add(sp);
  }
  spawn.set(A.x-Math.sign(A.x||1)*PITCH/2,0,A.z-Math.sign(A.z||1)*PITCH/2);
  drawMapStatic();
}
function updateCars(dt){
  if(!carMesh)return;
  const lim=span/2+30;
  for(let i=0;i<cars.length;i++){
    const c=cars[i];c.t+=c.v*dt;if(c.t>lim)c.t=-lim;if(c.t<-lim)c.t=lim;
    if(c.axis===0){dummy.position.set(c.t,0.65,c.line+c.lane);dummy.rotation.set(0,PI/2,0);}

    dummy.scale.set(1,1,1);dummy.updateMatrix();carMesh.setMatrixAt(i,dummy.matrix);
  }

}

let audio=null,muted=false;
function initAudio(){
  if(audio){if(audio.ctx.state==='suspended'&&!muted)audio.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx=new AC();
  const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=46;
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=240;
  const g=ctx.createGain();g.gain.value=0.07;
  const lfo=ctx.createOscillator();lfo.frequency.value=13;
  const lg=ctx.createGain();lg.gain.value=0.035;
  lfo.connect(lg);lg.connect(g.gain);o.connect(f);f.connect(g);g.connect(ctx.destination);
  o.start();lfo.start();audio={ctx,g,o,lfo};
}
function toggleMute(){muted=!muted;if(audio)audio.ctx[muted?'suspend':'resume']();toast(muted?'Sound off':'Sound on',1000);}
function updateAudio(){
  if(!audio||muted)return;
  const hs=Math.hypot(heli.vel.x,heli.vel.z),act=clamp(hs/24,0,1.2),t=audio.ctx.currentTime;
  audio.g.gain.setTargetAtTime(0.035+0.05*heli.fan+0.02*act,t,0.1);
  audio.o.frequency.setTargetAtTime(30+34*heli.fan+6*act,t,0.1);
  audio.lfo.frequency.setTargetAtTime(7+11*heli.fan,t,0.1);
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!audio||muted)return;const c=audio.ctx,t=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
}
const thump=v=>tone('square',110,28,0.3,v);
function chime(){[660,880,1175].forEach((f,i)=>tone('sine',f,f,0.4,0.16,i*0.12));}
function womp(){[[311,0],[294,0.35],[277,0.7],[233,1.05]].forEach(([f,d],i)=>tone('sawtooth',f,f*(i===3?0.7:0.97),i===3?0.9:0.32,0.12,d));}
function boom(){tone('sine',90,25,0.7,0.5);}

/* ---------- physics ---------- */
function supportBelow(x,z){
  let h=0;const bottom=heli.pos.y-HB;
  for(const b of buildings){
    if(x>b.minX&&x<b.maxX&&z>b.minZ&&z<b.maxZ&&b.top<=bottom+0.8&&b.top>h)h=b.top;
  }
  return h;
}
function hurt(amount){
  if(amount<0.5||state!=='play')return;
  const now=performance.now();if(now-lastHit<350)return;lastHit=now;
  heli.health=Math.max(0,heli.health-amount);
  fire({e:'hurt',a:amount,m:pick(HURT_LINES)});
  if(heli.health<=0&&state==='play')fire({e:'crash'});
}
const touchdown=s=>{if(s>4.5)hurt((s-4.5)*7);};
const bump=s=>{if(s>2.2)hurt(Math.min(30,(s-2)*2.4));};

function collide(){
  const p=heli.pos,v=heli.vel;let grounded=false,surf=null;
  if(p.y-HB<=0.02){touchdown(-v.y);p.y=HB;if(v.y<0)v.y=0;grounded=true;}
  for(let k=0;k<buildings.length;k++){
    const b=buildings[k];
    if(p.x+HX<=b.minX||p.x-HX>=b.maxX||p.z+HX<=b.minZ||p.z-HX>=b.maxZ)continue;
    const bottom=p.y-HB;if(bottom>=b.top+0.02)continue;
    const ox=Math.min(p.x+HX-b.minX,b.maxX-(p.x-HX));
    const oz=Math.min(p.z+HX-b.minZ,b.maxZ-(p.z-HX));
    const oy=b.top-bottom;
    if(oy<=ox&&oy<=oz){touchdown(-v.y);p.y=b.top+HB;if(v.y<0)v.y=0;grounded=true;surf=b;}
    else if(ox<=oz){const d=p.x<b.x?-1:1;p.x+=d*ox;const vn=v.x*d;if(vn<0){bump(-vn);v.x-=1.3*vn*d;}}
    else{const d=p.z<b.z?-1:1;p.z+=d*oz;const vn=v.z*d;if(vn<0){bump(-vn);v.z-=1.3*vn*d;}}
  }
  heli.grounded=grounded;heli.surf=surf;
}

function step(dt,inp){
  const p=heli.pos,v=heli.vel;
  heli.time+=dt;
  const sy=Math.sin(heli.yaw),cy=Math.cos(heli.yaw);
  const fx=-sy,fz=-cy,rx=cy,rz=-sy;
  wind.set(windS*(Math.sin(clock*.27)*.7+Math.sin(clock*.71)*.3),0,windS*(Math.cos(clock*.21)*.7+Math.cos(clock*.57)*.3));
  windMag=Math.hypot(wind.x,wind.z);

  // fan speed (the co-pilot's lever): above the hover mark climbs, below it sinks
  if(inp.hover){heli.fanT=0.5;fire({e:'toast',s:'Auto-hover engaged',ms:900});}
  heli.fanT=clamp(heli.fanT+inp.fan*0.4*dt,0,1);
  heli.fan+=(heli.fanT-heli.fan)*(1-Math.exp(-3*dt));

  // horizontal (pilot: thrust and turn, co-pilot: slide)
  const sF=inp.thrust>0?24:12,sS=15;
  let dx=fx*inp.thrust*sF+rx*inp.slide*sS,dz=fz*inp.thrust*sF+rz*inp.slide*sS;
  if(heli.grounded){dx*=0.3;dz*=0.3;}else{dx+=wind.x;dz+=wind.z;}
  const ka=1-Math.exp(-(heli.grounded?3.5:1.7)*dt);
  v.x+=(dx-v.x)*ka;v.z+=(dz-v.z)*ka;

  // vertical from fan speed
  let f=heli.fan-0.5;
  if(Math.abs(f)<0.025)f=0;else f-=Math.sign(f)*0.025;
  const dy=f>0?f/0.475*9:f/0.475*6.5;
  const alt=Math.max(0,p.y-HB-supportBelow(p.x,p.z));
  v.y+=(dy-v.y)*(1-Math.exp(-2.4*dt));
  v.y=Math.max(v.y,-(2+1.1*alt)); // landing governor

  heli.yawRate+=(inp.turn*1.6-heli.yawRate)*(1-Math.exp(-4*dt));
  heli.yaw+=heli.yawRate*dt;
  p.addScaledVector(v,dt);
  collide();

  const lim=span/2+70;
  if(Math.abs(p.x)>lim){p.x=Math.sign(p.x)*lim;v.x*=-0.2;toast('Stay inside the city');}
  if(Math.abs(p.z)>lim){p.z=Math.sign(p.z)*lim;v.z*=-0.2;toast('Stay inside the city');}
  if(p.y>170){p.y=170;if(v.y>0)v.y=0;}

  const vf=v.x*fx+v.z*fz,vr=v.x*rx+v.z*rz;
  const tp=heli.grounded?0:-vf/24*0.28,tr=heli.grounded?0:-vr/15*0.28-heli.yawRate*0.06;
  heli.pitchV+=(tp-heli.pitchV)*(1-Math.exp(-6*dt));heli.rollV+=(tr-heli.rollV)*(1-Math.exp(-6*dt));

  // loading: both players must hold their load key
  const hSpeed=Math.hypot(v.x,v.z);
  let onPad=null;
  if(heli.grounded&&heli.surf&&heli.surf.pad){const pd=heli.surf.pad;if(Math.hypot(p.x-pd.x,p.z-pd.z)<pd.r-1)onPad=pd;}
  const target=phase==='pickup'?pickup:dest;
  ui.p1=inp.l1;ui.p2=inp.l2;
  if(onPad===target&&hSpeed<2.5){
    ui.loadOn=true;
    if(inp.l1&&inp.l2)loadProg+=dt/2.2;else loadProg=Math.max(0,loadProg-dt*0.7);
    if(loadProg>=1)completeStop();
  }else{ui.loadOn=false;loadProg=Math.max(0,loadProg-dt*1.5);}

  memes(dt,alt,hSpeed,onPad);
}

function memes(dt,alt,hSpeed,onPad){
  const once=(k,fn)=>{if(!mf[k]){mf[k]=1;fn();}};
  if(heli.grounded&&heli.surf&&!heli.surf.pad)once('roof',()=>fire({e:'toast',s:'Sir, this is not a helipad 🗿'}));
  if(alt>0&&heli.pos.y>110)once('high',()=>fire({e:'toast',s:'Why are we this high? 😳'}));
  if(hSpeed>20)once('fast',()=>fire({e:'toast',s:'Zoom zoom 🚀'}));
  if(heli.health<30)once('low',()=>fire({e:'toast',s:'This is fine. 🔥'}));
  if(heli.fan>0.97)once('max',()=>fire({e:'toast',s:'MAX FAN. Hold on to your hats 🎩'}));
  if(phase==='pickup'&&Math.hypot(heli.pos.x-pickup.x,heli.pos.z-pickup.z)<60)once('near',()=>fire({e:'say',em:pass.e,s:'Over here!! Pick me up!'}));
  if(loaded){sayTimer-=dt;if(sayTimer<=0){sayTimer=9+Math.random()*7;fire({e:'say',em:pass.e,s:pick(pass.lines.concat(COMMON))});}}
}

function completeStop(){
  loadProg=0;
  if(phase==='pickup'){
    phase='deliver';loaded=true;sayTimer=6;
    fire({e:'chime'});fire({e:'toast',s:'Passengers aboard. Lift off together.'});
  }else{finish();}
}
function finish(){
  const dist=Math.hypot(pickup.x-dest.x,pickup.z-dest.z);
  const pts=Math.round(Math.max(150,1200+level*100-heli.time*6-(100-heli.health)*6));
  totalScore+=pts;
  fire({e:'win',pts,total:totalScore,time:heli.time,hp:heli.health,dist,level});
}

/* ---------- level flow ---------- */

  heli.fan=heli.fanT=0.3;

/* ---------- online (PeerJS, host is authoritative) ---------- */
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const makeCode=()=>Array.from({length:5},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
function setNetChip(role){
  document.body.classList.remove('online-p1','online-p2');document.body.classList.add(role==='p1'?'online-p1':'online-p2');
  el.net.style.display='block';el.net.querySelector('i').style.background=role==='p1'?'#46e0cc':'#ff7f90';
  el.netTxt.textContent='Online: you are the '+(role==='p1'?'Pilot':'Co-pilot');
}
function netFail(err){
  const type=err&&err.type;
  let msg='Could not connect. Check your internet and try again.';
  if(type==='peer-unavailable')msg='No room with that code. Check it and try again.';
  else if(type==='network'||type==='server-error'||type==='socket-error'||type==='socket-closed')msg='Could not reach the matchmaking server. Try again in a moment.';
  resetToMenu(msg);
}
function hostRoom(code,attempt){
  const peer=new Peer('tandemlift-'+code);net.peer=peer;
  peer.on('open',()=>{
    showOverlay('<h1>Room</h1><div class="code">'+code+'</div>'+
      '<p class="lead">Send this code to your co-pilot.</p><p>They open this game, type the code next to Join, and tap Join. You fly as the Pilot. The game starts when they connect.</p>'+
      '<p class="netmsg">Waiting for your co-pilot</p><button class="mbtn" id="bCopy">Copy code</button> <button class="mbtn" id="bCancel">Cancel</button>');
    $('bCancel').onclick=()=>resetToMenu();
    $('bCopy').onclick=()=>{try{navigator.clipboard.writeText(code);$('bCopy').textContent='Copied';}catch(e){$('bCopy').textContent=code;}};
  });
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&attempt<5){try{peer.destroy();}catch(e){}hostRoom(makeCode(),attempt+1);}
    else netFail(err);
  });
  peer.on('connection',conn=>{
    if(net.conn){conn.close();return;}
    net.conn=conn;
    conn.on('open',()=>{
      net.remote={fan:0,slide:0,hover:false,load:false};
      setNetChip('p1');loadLevel(1);syncLevel();startPlay();
    });
    conn.on('data',onData);
    conn.on('close',()=>{if(conn===net.conn)resetToMenu('Your co-pilot disconnected.');});
    conn.on('error',()=>{if(conn===net.conn)resetToMenu('The connection dropped.');});
  });
}
function startHost(){
  if(typeof Peer==='undefined'){netMsg('Online play needs the PeerJS library from a CDN, which did not load. Check your connection.');return;}
  net.mode='host';seedBase=(Math.random()*1e9)|0;totalScore=0;heli.health=100;
  netMsg('Opening a room');hostRoom(makeCode(),0);
}
function startJoin(raw){
  const code=(raw||'').trim().toUpperCase();
  if(code.length<4){netMsg('Type the room code your friend gave you.');return;}
  if(typeof Peer==='undefined'){netMsg('Online play needs the PeerJS library from a CDN, which did not load. Check your connection.');return;}
  net.mode='guest';netMsg('Joining room '+code);
  const peer=new Peer();net.peer=peer;
  const timeout=setTimeout(()=>{if(!net.conn||!net.conn.open)resetToMenu('Timed out. Check the code and that the host is waiting.');},15000);
  peer.on('error',err=>{clearTimeout(timeout);netFail(err);});
  peer.on('open',()=>{
    const conn=peer.connect('tandemlift-'+code,{reliable:true});net.conn=conn;
    conn.on('open',()=>{
      clearTimeout(timeout);setNetChip('p2');conn.send({t:'hi'});
      showOverlay('<h1>Connected</h1><p class="lead">Waiting for the host to launch the helicopter.</p><button class="mbtn" id="bCancel">Leave</button>');
      $('bCancel').onclick=()=>resetToMenu();
      net.inT=setInterval(()=>sendNet(guestInputs()),33);
    });
    conn.on('data',onData);
    conn.on('close',()=>{if(conn===net.conn)resetToMenu('The host left the game.');});
    conn.on('error',()=>{if(conn===net.conn)resetToMenu('The connection dropped.');});
  });
}
function onData(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'in':
      if(net.mode==='host'){const rm=net.remote;rm.fan=clamp(+m.fan||0,-1,1);rm.slide=clamp(+m.slide||0,-1,1);if(m.hover)rm.hover=true;rm.load=!!m.load;}
      break;
    case 's':if(net.mode==='guest')applySnap(m);break;
    case 'lvl':
      if(net.mode==='guest'){seedBase=m.seedBase;loadLevel(m.level);heli.health=m.hp;totalScore=m.total;startPlay();}
      break;
    case 'ev':if(net.mode==='guest'&&m.m)handleEvent(m.m);break;
    case 'react':if(REACT.includes(m.em))spawnReact(m.em,m.who==='p1'||m.who==='p2'?m.who:'');break;
  }
}
function sendSnap(){
  if(net.mode!=='host'||!net.conn||!net.conn.open)return;
  const p=heli.pos,v=heli.vel;
  sendNet({t:'s',p:[r2(p.x),r2(p.y),r2(p.z)],v:[r2(v.x),r2(v.y),r2(v.z)],y:r3(heli.yaw),pt:r3(heli.pitchV),rl:r3(heli.rollV),
    fan:r3(heli.fan),ft:r3(heli.fanT),hp:Math.round(heli.health*10)/10,ph:phase,ld:loaded?1:0,lp:r3(loadProg),tm:r2(heli.time),
    sc:totalScore,wm:r2(windMag),lw:ui.loadOn?1:0,k1:ui.p1?1:0,k2:ui.p2?1:0,g:heli.grounded?1:0});
}
function applySnap(m){
  snap.p.set(m.p[0],m.p[1],m.p[2]);snap.v.set(m.v[0],m.v[1],m.v[2]);snap.t=performance.now();snap.yaw=m.y;
  if(!snap.has){heli.pos.copy(snap.p);heli.yaw=m.y;snap.has=true;}
  heli.pitchV=m.pt;heli.rollV=m.rl;heli.fan=m.fan;heli.fanT=m.ft;heli.health=m.hp;phase=m.ph;loaded=!!m.ld;loadProg=m.lp;heli.time=m.tm;
  totalScore=m.sc;windMag=m.wm;ui.loadOn=!!m.lw;ui.p1=!!m.k1;ui.p2=!!m.k2;heli.grounded=!!m.g;heli.vel.copy(snap.v);
}

/* ---------- camera, HUD, loop ---------- */
const tmpV=new V3(),camTarget=new V3();
function updateCamera(dt){
  if(state==='play'){
    camYaw+=angDiff(heli.yaw,camYaw)*(1-Math.exp(-2.2*dt));
    const sy=Math.sin(camYaw),cy=Math.cos(camYaw);
    camTarget.set(heli.pos.x+sy*21,heli.pos.y+8,heli.pos.z+cy*21);
    for(const b of buildings){
      if(camTarget.x>b.minX-1&&camTarget.x<b.maxX+1&&camTarget.z>b.minZ-1&&camTarget.z<b.maxZ+1&&camTarget.y<b.top+3)camTarget.y=b.top+3;
    }
    camera.position.lerp(camTarget,1-Math.exp(-5*dt));
    const c=camera.position;
    for(const b of buildings){
      if(c.x>b.minX-1&&c.x<b.maxX+1&&c.z>b.minZ-1&&c.z<b.maxZ+1&&c.y<b.top+2)c.y=b.top+2;
    }
    if(shake>0){c.x+=(Math.random()-.5)*shake*1.2;c.y+=(Math.random()-.5)*shake*1.2;shake=Math.max(0,shake-dt*2);}
    tmpV.set(heli.pos.x-sy*5,heli.pos.y+1,heli.pos.z-cy*5);
    camera.lookAt(tmpV);
  }else{
    orbit+=dt*0.25;
    camTarget.set(heli.pos.x+Math.cos(orbit)*38,heli.pos.y+15,heli.pos.z+Math.sin(orbit)*38);
    camera.position.lerp(camTarget,1-Math.exp(-3*dt));
    camera.lookAt(heli.pos.x,heli.pos.y+2,heli.pos.z);
  }
  sky.position.copy(camera.position);
}
function calcInfo(){
  const p=heli.pos,sy=Math.sin(heli.yaw),cy=Math.cos(heli.yaw);
  return {alt:Math.max(0,p.y-HB-supportBelow(p.x,p.z)),hSpeed:Math.hypot(heli.vel.x,heli.vel.z),fx:-sy,fz:-cy,rx:cy,rz:-sy};
}
function updateHUD(info){
  const p=heli.pos,v=heli.vel;
  const tgt=phase==='pickup'?pickup:dest;
  const dx=tgt.x-p.x,dz=tgt.z-p.z,dist=Math.hypot(dx,dz);
  const rel=Math.atan2(dx*info.rx+dz*info.rz,dx*info.fx+dz*info.fz);
  el.arrow.style.transform='rotate('+rel+'rad)';
  el.arrowPath.setAttribute('fill',phase==='pickup'?'#a6e35a':'#ffc857');
  el.obT.textContent=phase==='pickup'?'Pick up the passengers':'Deliver to the gold pad';
  let sub=(phase==='pickup'?'Green pad, ':'Gold pad, ')+Math.round(dist)+' m away';
  if(heli.grounded&&heli.fan<0.5&&dist>25)sub='Co-pilot: spin the fan up to lift off';
  el.obS.textContent=sub;
  el.hp.style.width=heli.health+'%';el.hp.style.background=heli.health>60?'#a6e35a':heli.health>30?'#ffc857':'#ff5a6a';
  el.tm.textContent=fmtTime(heli.time);el.lv.textContent='City '+level;el.sc.textContent=totalScore+' pts';
  el.alt.textContent=Math.round(info.alt)+' m';el.spd.textContent=info.hSpeed.toFixed(0)+' m/s';
  el.vs.textContent=(v.y>=0?'+':'')+v.y.toFixed(1)+' m/s';
  el.vs.style.color=(v.y<-3.5&&info.alt<12)?'#ffc857':'';
  el.wind.textContent=windS<0.1?'Calm':windMag.toFixed(0)+' m/s';
  const f=heli.fan;
  el.fanfill.style.width=(f*100)+'%';
  const st=Math.abs(f-0.5)<0.03?'hover':f>0.5?'climb':'sink';
  el.fanfill.style.background=st==='hover'?'#8ecbff':st==='climb'?'#a6e35a':'#ffc857';
  el.fanst.textContent=st;
}
function renderLoadUI(){
  el.loadwrap.classList.toggle('on',ui.loadOn&&state==='play');
  el.loadtxt.textContent=phase==='pickup'?'Loading passengers':'Unloading passengers';
  el.pl1.classList.toggle('on',ui.p1);el.pl2.classList.toggle('on',ui.p2);
  el.loadfill.style.width=(loadProg*100)+'%';
}

showMenu();
loadLevel(1);

let last=performance.now(),lastInfo=calcInfo();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused)clock+=dt;
  if(!paused){
    if(state==='play'){
      if(net.mode==='guest'){
        if(snap.has){
          const age=Math.min((performance.now()-snap.t)/1000,0.25);
          tmpV.copy(snap.v).multiplyScalar(age).add(snap.p);
          const k=1-Math.exp(-14*dt);
          heli.pos.lerp(tmpV,k);heli.yaw+=angDiff(snap.yaw,heli.yaw)*k;
        }
      }else{
        step(dt,readInputs());
        snapT+=dt;if(snapT>=0.05){snapT=0;sendSnap();}
      }
      hudT+=dt;if(hudT>0.08){hudT=0;lastInfo=calcInfo();updateHUD(lastInfo);}
      renderLoadUI();
    }else if(state!=='menu'){
      if(net.mode==='host'){snapT+=dt;if(snapT>=0.05){snapT=0;sendSnap();}}
      renderLoadUI();
    }
    updateCars(dt);updateAudio();
    for(let i=debris.length-1;i>=0;i--){
      const d=debris[i],u=d.userData;u.v.y-=22*dt;d.position.addScaledVector(u.v,dt);
      if(!d.isSprite){d.rotation.x+=dt*4;d.rotation.z+=dt*3;}
      if(d.position.y<0.2){d.position.y=0.2;u.v.multiplyScalar(0.4);}
      u.life-=dt;if(u.life<0){scene.remove(d);debris.splice(i,1);}
    }
    pickup.beam.material.opacity=phase==='pickup'?0.26+0.08*Math.sin(clock*3):0.06;
    dest.beam.material.opacity=phase==='deliver'?0.26+0.08*Math.sin(clock*3):0.06;
    pickup.people.visible=!loaded;
    if(!loaded)pickup.people.children.slice(0,4).forEach((c,i)=>{c.position.y=1.8+Math.abs(Math.sin(clock*3+i*1.3))*0.9;});
    model.cargo.visible=loaded;model.riders.visible=loaded&&model.group.visible;
    if(loaded)model.riders.children.forEach((c,i)=>{c.position.y=3.4+Math.abs(Math.sin(clock*4+i*2))*0.35;});
    const pos=heli.pos;
    model.group.position.copy(pos);
    model.group.rotation.set(heli.pitchV,heli.yaw,heli.rollV);
    const spin=8+52*heli.fan;
    model.rotor.rotation.y+=spin*dt;model.tail.rotation.x+=(12+60*heli.fan)*dt;
    model.strobe.visible=Math.sin(clock*8)>0.4;
    const sh=supportBelow(pos.x,pos.z),alt=Math.max(0,pos.y-HB-sh);
    blob.position.set(pos.x,sh+0.2,pos.z);blob.scale.setScalar(1+alt*0.02);blob.material.opacity=Math.max(0.08,0.38-alt*0.008);
    updateCamera(dt);
    drawMap(clock);
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
