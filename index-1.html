<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutcracker Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --coal:#0e0d0c;
    --lacquer:#c8231e;
    --lacquer-dark:#7c1410;
    --gold:#f2a51c;
    --gold-soft:#ffcd5c;
    --bone:#f6f1e6;
    --display:'Russo One','Arial Black',Impact,sans-serif;
    --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    --cut:18px; /* chamfer size used on every panel, like the logo's angled shoulders */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:var(--body);
    font-size:1.0625rem;
    line-height:1.55;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  :focus-visible{outline:3px solid var(--gold-soft);outline-offset:3px}

  /* ---------- top bar ---------- */
  .bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px clamp(16px,4vw,48px);
    border-bottom:2px solid var(--gold);
  }
  .bar .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .bar .brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 38%;transform:scale(1.9);transform-origin:50% 38%;overflow:hidden}
  .bar .brand .mark{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--gold);background:#000}
  .bar .brand span.name{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
  .bar nav a{
    text-decoration:none;font-weight:600;padding:8px 14px;
    border:2px solid transparent;
  }
  .bar nav a:hover{border-color:var(--gold);color:var(--gold-soft)}

  /* ---------- hero ---------- */
  .hero{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
    align-items:center;
    gap:clamp(16px,4vw,56px);
    max-width:1180px;margin:0 auto;
    padding:clamp(28px,6vw,72px) clamp(16px,4vw,48px) clamp(24px,4vw,48px);
  }
  .hero .logo{
    width:100%;max-width:460px;justify-self:center;
    aspect-ratio:1;
    animation:march 900ms cubic-bezier(.2,.9,.25,1.2) both;
  }
  @keyframes march{
    from{opacity:0;transform:translateY(-34px) scale(.94)}
    to{opacity:1;transform:none}
  }
  .hero h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(2.4rem,6vw,4.4rem);
    line-height:1.02;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  .hero p{
    margin-top:18px;max-width:34ch;
    color:#d9d2c1;font-size:1.15rem;
  }
  .btn{
    --c:var(--gold);
    display:inline-block;cursor:pointer;
    font-family:var(--display);font-size:1.05rem;letter-spacing:.03em;
    color:#1a0c00;background:var(--c);
    border:0;padding:14px 26px;text-decoration:none;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
    transition:background .15s, transform .15s;
  }
  .btn:hover{background:var(--gold-soft);transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .hero .btn{margin-top:28px}

  /* ---------- shelf ---------- */
  .shelf{
    max-width:1180px;margin:0 auto;
    padding:24px clamp(16px,4vw,48px) 80px;
  }
  .shelf-head{
    display:flex;align-items:center;gap:18px;margin-bottom:28px;
  }
  .shelf-head h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.2rem);white-space:nowrap}
  .shelf-head .line{flex:1;height:3px;background:var(--gold)}
  .count{color:var(--gold-soft);font-weight:600;white-space:nowrap}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));
    gap:28px;
  }

  /* game box: gold outer plate + lacquer-red inner plate, both chamfered */
  .box{
    position:relative;display:block;text-align:left;cursor:pointer;
    background:var(--gold);border:0;color:inherit;font:inherit;
    padding:4px;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
    transition:transform .18s ease, background .18s ease;
  }
  .box .in{
    display:flex;flex-direction:column;height:100%;
    background:var(--coal);
    clip-path:polygon(calc(var(--cut) - 3px) 0,100% 0,100% calc(100% - var(--cut) + 3px),calc(100% - var(--cut) + 3px) 100%,0 100%,0 calc(var(--cut) - 3px));
  }
  .box:hover,.box:focus-visible{transform:translateY(-6px);background:var(--gold-soft)}
  .box:focus-visible{outline-offset:6px}

  .art{
    position:relative;aspect-ratio:3/2;overflow:hidden;
    background:
      repeating-linear-gradient(135deg,rgba(0,0,0,.18) 0 14px,transparent 14px 28px),
      linear-gradient(160deg,var(--lacquer),var(--lacquer-dark));
    display:grid;place-items:center;
    border-bottom:4px solid var(--gold);
  }
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .art.contain{background:#000}
  .art.contain img{object-fit:contain}
  .art .initial{
    font-family:var(--display);font-size:5.5rem;line-height:1;
    color:var(--bone);text-shadow:4px 4px 0 rgba(0,0,0,.45);
  }
  .art .tag{
    position:absolute;left:0;top:14px;
    background:var(--bone);color:#1a1a1a;
    font-weight:600;font-size:.85rem;padding:3px 12px 3px 10px;
    clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);
  }
  .meta{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
  .meta h3{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.15}
  .meta p{color:#cfc8b8;font-size:1rem;flex:1}
  .play{
    margin-top:12px;align-self:flex-start;
    font-family:var(--display);font-size:.95rem;
    color:#1a0c00;background:var(--gold);padding:8px 18px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:background .15s;
  }
  .box:hover .play,.box:focus-visible .play{background:var(--lacquer);color:var(--bone)}

  /* empty slot for the next game */
  .slot{
    display:grid;place-items:center;text-align:center;
    min-height:280px;padding:24px;
    border:3px dashed #5b4a1c;color:#9c8a55;
  }
  .slot strong{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--gold);margin-bottom:6px}

  footer{
    border-top:2px solid var(--gold);
    padding:28px clamp(16px,4vw,48px);
    text-align:center;color:#a49c8a;font-size:.95rem;
  }

  /* ---------- player overlay ---------- */
  .player{
    position:fixed;inset:0;z-index:50;
    background:var(--ink);
    display:none;flex-direction:column;
  }
  .player.open{display:flex;animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .player-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px clamp(12px,3vw,28px);
    background:var(--coal);border-bottom:3px solid var(--gold);
  }
  .player-bar h2{font-family:var(--display);font-weight:400;font-size:1.2rem;margin-right:auto}
  .pbtn{
    font:600 .95rem var(--body);cursor:pointer;
    color:var(--bone);background:transparent;
    border:2px solid var(--gold);padding:7px 14px;text-decoration:none;
  }
  .pbtn:hover{background:var(--gold);color:#1a0c00}
  .pbtn.close{background:var(--lacquer);border-color:var(--lacquer)}
  .pbtn.close:hover{background:var(--bone);border-color:var(--bone);color:#1a0c00}
  .stage{position:relative;flex:1;background:#000}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .loading{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:#bdb5a2;padding:24px;pointer-events:none;
  }
  .loading.done{display:none}

  /* ---------- small screens ---------- */
  @media (max-width:760px){
    .hero{grid-template-columns:1fr;text-align:center}
    .hero p{margin-inline:auto}
    .hero .logo{max-width:320px;order:-1}
    .bar nav{display:none}
    .shelf-head .count{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>

/* ---------- build the shelf ---------- */
const grid = document.getElementById('grid');

function makeCard(g){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'box';
  b.setAttribute('aria-label', 'Play ' + g.title);

  const art = document.createElement('div');
  art.className = 'art' + (g.fit === 'contain' ? ' contain' : '');
  if (g.thumb){
    const img = document.createElement('img');
    img.src = g.thumb; img.alt = ''; img.loading = 'lazy';
    img.onerror = () => { img.remove(); art.prepend(initial()); };
    art.appendChild(img);
  } else {
    art.appendChild(initial());
  }
  function initial(){
    const s = document.createElement('span');
    s.className = 'initial';
    s.textContent = g.title.trim().charAt(0).toUpperCase();
    return s;
  }
  if (g.tag){
    const t = document.createElement('span');
    t.className = 'tag'; t.textContent = g.tag;
    art.appendChild(t);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = '<h3></h3><p></p><span class="play">Play now</span>';
  meta.querySelector('h3').textContent = g.title;
  meta.querySelector('p').textContent = g.blurb;

  const inner = document.createElement('div');
  inner.className = 'in';
  inner.append(art, meta);
  b.appendChild(inner);
  b.addEventListener('click', () => {
    if (OPEN_MODE === 'page') location.href = g.url;
    else openGame(g, true);
  });
  return b;
}

GAMES.forEach(g => grid.appendChild(makeCard(g)));

const slot = document.createElement('div');
slot.className = 'slot';
slot.innerHTML = '<div><strong>More games coming</strong>Check back soon.</div>';
grid.appendChild(slot);

document.getElementById('count').textContent =
  GAMES.length + (GAMES.length === 1 ? ' game' : ' games');
document.getElementById('year').textContent = new Date().getFullYear();

/* ---------- player ---------- */
const player  = document.getElementById('player');
const stage   = document.getElementById('stage');
const loading = document.getElementById('loading');
const titleEl = document.getElementById('player-title');
const newtab  = document.getElementById('newtab');
let frame = null, lastFocus = null;

function openGame(g, updateHash){
  lastFocus = document.activeElement;
  titleEl.textContent = g.title;
  newtab.href = g.url;
  loading.classList.remove('done');

  if (frame) frame.remove();
  frame = document.createElement('iframe');
  frame.title = g.title;
  frame.allow = 'fullscreen; autoplay; gamepad; gyroscope; accelerometer';
  frame.setAttribute('allowfullscreen', '');
  frame.addEventListener('load', () => loading.classList.add('done'));
  frame.src = g.url;
  stage.appendChild(frame);

  player.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('close').focus();
  if (updateHash) history.replaceState(null, '', '#play=' + g.id);
}

function closeGame(){
  player.classList.remove('open');
  document.body.style.overflow = '';
  if (frame){ frame.remove(); frame = null; }   // stops the game and its sound
  history.replaceState(null, '', location.pathname + location.search + '#games');
  if (lastFocus) lastFocus.focus();
}

document.getElementById('close').addEventListener('click', closeGame);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && player.classList.contains('open') && !document.fullscreenElement) closeGame();
});
document.getElementById('fs').addEventListener('click', () => {
  const el = frame || stage;
  (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
});

/* open a game straight from a shared link, e.g. yoursite.com/#play=space-simulator */
function checkHash(){
  const m = location.hash.match(/^#play=(.+)$/);
  if (!m) return;
  const g = GAMES.find(x => x.id === decodeURIComponent(m[1]));
  if (g) openGame(g, false);
}
window.addEventListener('load', checkHash);
</script>
